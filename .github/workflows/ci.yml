name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run docs:quickstart-check
      - run: npm test
      - run: npm run test:control-plane
      - run: npm run smoke:pack
