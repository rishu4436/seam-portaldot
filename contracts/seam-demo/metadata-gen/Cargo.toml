[package]
name = "seam_demo_metadata_gen"
version = "0.1.0"
edition = "2021"
publish = false

# Prints the contract's ink! metadata (InkProject) as JSON. build.sh wraps it into metadata.json.
# This is what cargo-contract does internally; see build.sh for why we don't use cargo-contract here.
[dependencies]
seam_demo = { path = "..", default-features = false, features = ["std"] }
ink = { version = "=5.1.1" }
serde_json = "1"

[workspace]
